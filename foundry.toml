[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
test    = "test"
script  = "script"
solc    = "0.8.20"
 
evm_version          = "paris"
optimizer            = true
optimizer_runs       = 200
via_ir               = true
 
[profile.default.fuzz]
runs = 256

[profile.default.lint]
severity = ["high", "med"]
 
[rpc_endpoints]
somnia_testnet = "${SOMNIA_TESTNET_RPC}"
somnia_mainnet = "https://mainnet-rpc.somnia.network"

[etherscan]
somnia_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://shannon-explorer.somnia.network/api" }
